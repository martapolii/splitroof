name: SplitRoof CI Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies & Run API Tests
        working-directory: ./backend
        run: |
          npm ci
          npm test

      - name: Install Frontend Dependencies & Run UI Tests
        working-directory: ./frontend
        run: |
          npm install
          npm test -- --watchAll=false